name: Taxfix
description: 'Taxfix is a Berlin-based fintech that lets individuals and self-employed people in Germany
  prepare and file their annual income tax return from a mobile app or web browser. Users either answer
  a guided set of roughly 70 questions to self-file (Taxfix Basic) or hand the return to an independent
  tax expert via the Expert Service, with data transmitted to the tax authority over the official ELSTER
  interface. The company reports more than 10 million tax returns filed and over 5 billion euros in refunds.
  Taxfix is a consumer (B2C) product and does not publish a public developer API, developer portal, or
  API documentation; this profile captures its public identity and domain-security posture. Backed by
  Creandum, Index Ventures and Speedinvest.'
